<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="人生の輪の8つの領域から、内省のための問いをランダムに引けるカードです。">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#02172f" media="(prefers-color-scheme: dark)">
  <title>内省の問いカード | COACHING-L</title>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="問いカード">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ロゴ＋COACHING-L（ポモドーロタイマーと同じ組み方） -->
    <header class="brand-header">
      <img class="brand-logo" src="icons/logo-144.png" width="52" height="52" alt="">
      <div>
        <p class="brand-name">COACHING-L</p>
        <h1 class="app-title">内省の問いカード</h1>
      </div>
    </header>
    <p class="intro"><span class="phrase">「人生の輪」の8つの領域から、</span><span class="phrase">自分に問いかけてみましょう。</span></p>

    <main>
      <section class="categories" aria-labelledby="category-heading">
        <h2 id="category-heading" class="section-label">カテゴリを選ぶ</h2>
        <div class="category-list" id="category-list" role="group" aria-labelledby="category-heading">
          <!-- app.js がボタンを作ります -->
        </div>
      </section>

      <section class="deck" aria-label="問いカード">
        <div class="card" id="card" role="button" tabindex="0" aria-describedby="card-hint">
          <div class="card-inner">
            <div class="card-face card-back is-all" id="card-back">
              <div class="card-back-frame">
                <img class="card-logo" src="icons/logo-144.png" width="72" height="72" alt="">
                <p class="card-back-category"><span class="card-back-dot" aria-hidden="true"></span><span id="card-back-category">すべて</span></p>
                <p class="card-back-hint">タップして問いを引く</p>
              </div>
            </div>
            <div class="card-face card-front" id="card-front" aria-hidden="true">
              <div class="card-band" aria-hidden="true"></div>
              <p class="card-category"><span class="card-dot" aria-hidden="true"></span><span id="card-category"></span></p>
              <p class="card-question" id="card-question"></p>
            </div>
          </div>
        </div>
        <p class="visually-hidden" id="card-hint">Enter キーまたはスペースキーでカードをめくれます。</p>

        <div class="controls">
          <button type="button" class="next-button" id="next-button">次のカード</button>
          <p class="skip-hint"><span class="phrase">答えにくい問いは、</span><span class="phrase">無理に考えずに次へ進んで</span><span class="phrase">大丈夫です。</span></p>
        </div>

        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <p class="sr-announce visually-hidden" id="sr-announce" aria-live="polite"></p>
      </section>
    </main>

    <footer class="app-footer">
      <p class="footer-brand">COACHING-L</p>
      <p class="footer-note"><span class="phrase">問いに正解はありません。</span><span class="phrase">思い浮かんだことを、</span><span class="phrase">ノートに書き出してみましょう。</span></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
